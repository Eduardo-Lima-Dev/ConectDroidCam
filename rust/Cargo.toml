[workspace]
resolver = "3"
members = [
    "crates/cdc-core",
    "crates/cdc-ffi",
    "crates/cdc-protocol",
    "crates/cdc-security",
    "crates/cdc-testsender",
    "crates/cdc-testreceiver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cdc-protocol = { path = "crates/cdc-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
