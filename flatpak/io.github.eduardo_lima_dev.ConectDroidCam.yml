app-id: io.github.eduardo_lima_dev.ConectDroidCam
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: conectdroidcam
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all

modules:
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - >-
        ./configure --prefix=/app --disable-everything --disable-doc --disable-debug
        --disable-ffplay --disable-ffprobe --disable-network --disable-autodetect
        --disable-x86asm --enable-ffmpeg --enable-avdevice --enable-avfilter
        --enable-swscale --enable-outdev=v4l2 --enable-protocol=file,pipe
        --enable-demuxer=h264 --enable-parser=h264,mjpeg --enable-decoder=h264,mjpeg
        --enable-encoder=mjpeg,rawvideo --enable-muxer=image2pipe,null,rawvideo
        --enable-filter=scale,transpose,pad,setsar,split,fps,null,format
      - make -j$(nproc)
      - make install
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz
        sha256: 1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433

  - name: conectdroidcam
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -r bundle/. /app/bin/
      - install -Dm644 io.github.eduardo_lima_dev.ConectDroidCam.desktop /app/share/applications/io.github.eduardo_lima_dev.ConectDroidCam.desktop
      - install -Dm644 io.github.eduardo_lima_dev.ConectDroidCam.metainfo.xml /app/share/metainfo/io.github.eduardo_lima_dev.ConectDroidCam.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/io.github.eduardo_lima_dev.ConectDroidCam/LICENSE
      - install -Dm755 linux-webcam-virtual.sh /app/share/conectdroidcam/linux-webcam-virtual.sh
      - >-
        for sz in 16 22 24 32 48 64 128 256 512; do
          install -Dm644 "hicolor/${sz}x${sz}/apps/io.github.eduardo_lima_dev.ConectDroidCam.png" \
            "/app/share/icons/hicolor/${sz}x${sz}/apps/io.github.eduardo_lima_dev.ConectDroidCam.png";
        done
    sources:
      - type: dir
        path: ../apps/conectdroidcam/build/linux/x64/release/bundle
        dest: bundle
      - type: file
        path: io.github.eduardo_lima_dev.ConectDroidCam.desktop
      - type: file
        path: io.github.eduardo_lima_dev.ConectDroidCam.metainfo.xml
      - type: file
        path: ../LICENSE
      - type: file
        path: ../scripts/setup/linux-webcam-virtual.sh
      - type: dir
        path: ../packaging/linux/icons/hicolor
        dest: hicolor
