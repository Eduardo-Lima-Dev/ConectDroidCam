name: CI

# Roda em cada PR. Num push na main, quem o chama é o workflow de release (release.yml),
# para a release só ser criada depois de todos os testes passarem.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg (usado pelo teste de ponta a ponta)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: rust

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/conectdroidcam
    steps:
      - uses: actions/checkout@v4
      - name: Ler a versão fixada do Flutter
        id: versao
        working-directory: .
        run: echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versao.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flatpak-metadata:
    name: Metadados Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar validadores
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Validar .desktop e .metainfo.xml
        run: |
          desktop-file-validate flatpak/io.github.eduardo_lima_dev.ConectDroidCam.desktop
          desktop-file-validate packaging/linux/io.github.eduardo_lima_dev.ConectDroidCam.desktop
          appstreamcli validate --no-net flatpak/io.github.eduardo_lima_dev.ConectDroidCam.metainfo.xml
