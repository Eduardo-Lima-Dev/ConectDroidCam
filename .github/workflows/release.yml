name: Build e release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.eduardo_lima_dev.ConectDroidCam
  BUNDLE: ConectDroidCam.flatpak
  PAGES_URL: https://eduardo-lima-dev.github.io/ConectDroidCam

jobs:
  ci:
    name: CI (testes)
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  apk:
    name: Gerar o APK (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ler a versão fixada do Flutter
        id: versao
        run: echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versao.outputs.flutter }}
          channel: stable
          cache: true
      - name: Chave de release do Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sem a chave de release: o APK sai assinado com a chave de debug."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: APK de release
        working-directory: apps/conectdroidcam
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}
      - name: Apagar a chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Copiar com o nome do app
        run: cp apps/conectdroidcam/build/app/outputs/flutter-apk/app-release.apk dist-apk-ConectDroidCam.apk
      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ConectDroidCam.apk
          path: dist-apk-ConectDroidCam.apk
          if-no-files-found: error

  flatpak:
    name: Gerar o .flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do build do Linux (GTK, CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Ferramentas do Flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Runtime e SDK do GNOME 51
        run: flatpak install --user -y --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - uses: dtolnay/rust-toolchain@stable

      - name: Ler a versão fixada do Flutter
        id: versao
        run: echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.versao.outputs.flutter }}
          channel: stable
          cache: true

      - name: Bundle de release do Linux
        working-directory: apps/conectdroidcam
        run: |
          flutter pub get
          flutter build linux --release \
            --build-number=${{ github.run_number }} \
            --dart-define=CDC_BUILD=${{ github.run_number }}

      - name: Chave de assinatura do repositório Flatpak
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_KEY_ID" ]; then
            echo "Sem a chave GPG: o repositório sai sem assinatura e não é publicado."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "GPG_ARGS=--gpg-sign=$GPG_KEY_ID --gpg-homedir=$GNUPGHOME"
          } >> "$GITHUB_ENV"

      - name: Montar o Flatpak
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --default-branch=stable $GPG_ARGS \
            --repo=dist/repo dist/build flatpak/${APP_ID}.yml
          flatpak build-update-repo $GPG_ARGS --prune --generate-static-deltas \
            --title="ConectDroidCam" --default-branch=stable dist/repo
          BUNDLE_ARGS=""
          if [ -n "$GPG_ARGS" ]; then
            BUNDLE_ARGS="--repo-url=${PAGES_URL}/repo/ --gpg-keys=flatpak/conectdroidcam-repo.gpg"
          fi
          flatpak build-bundle $BUNDLE_ARGS \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            dist/repo "dist/${BUNDLE}" "${APP_ID}" stable

      - name: Preparar o site do repositório Flatpak
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GPG_ARGS != ''
        run: |
          mkdir -p dist/pages
          cp -r flatpak/pages/. dist/pages/
          rm -rf dist/repo/tmp
          cp -r dist/repo dist/pages/repo
          du -sh dist/pages

      - name: Enviar o site como artefato do Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GPG_ARGS != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: dist/${{ env.BUNDLE }}
          if-no-files-found: error

      - name: Publicar na release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BUNDLE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release automática (só em push na main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, flatpak, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist/arquivos
          merge-multiple: true
      - name: Renomear os arquivos com a versão do build
        run: |
          ls -l dist/arquivos
          mv dist/arquivos/*.apk "dist/arquivos/ConectDroidCam-${GITHUB_RUN_NUMBER}.apk"
          mv dist/arquivos/*.flatpak "dist/arquivos/ConectDroidCam-${GITHUB_RUN_NUMBER}.flatpak"
      - name: Criar a release com os commits desde a anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          ANTERIOR="$(git describe --tags --match 'build-*' --abbrev=0 HEAD 2>/dev/null || true)"
          if [ -n "$ANTERIOR" ]; then
            INTERVALO="${ANTERIOR}..HEAD"
          else
            INTERVALO="HEAD"
          fi
          {
            echo "Build automático do commit \`${GITHUB_SHA:0:7}\`."
            echo
            echo "## Mudanças desde ${ANTERIOR:-o início}"
            echo
            git log --no-merges --pretty='- %s (%h)' "$INTERVALO" | head -200
            echo
            echo "## Arquivos"
            echo
            echo "- **ConectDroidCam-${GITHUB_RUN_NUMBER}.flatpak**: app do Linux. Instale com \`flatpak install --user ConectDroidCam-${GITHUB_RUN_NUMBER}.flatpak\`; depois ele se atualiza pelo repositório abaixo."
            echo "- **ConectDroidCam-${GITHUB_RUN_NUMBER}.apk**: app do Android. Depois de instalado, o próprio app avisa quando há versão nova."
            echo
            echo "## Linux com atualizações automáticas"
            echo
            echo "\`\`\`sh"
            echo "flatpak remote-add --user --if-not-exists conectdroidcam ${PAGES_URL}/conectdroidcam.flatpakrepo"
            echo "flatpak install --user conectdroidcam ${APP_ID}"
            echo "\`\`\`"
          } > notas.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ConectDroidCam build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
            --notes-file notas.md \
            dist/arquivos/*

  pages:
    name: Publicar o repositório Flatpak (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, flatpak, apk]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
